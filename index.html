<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link rel="apple-touch-icon" href="https://otarufoodsystem.github.io/timecardApp/tm_icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OFSタイムカード">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OFSタイムカード</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="timecard-frame" src="" allow="geolocation"></iframe>

  <script>
    window.onload = function() {
      // 1. GitHub PagesのURLからパラメータ（店舗名など）を取得
      const urlParams = new URLSearchParams(window.location.search);
      let storeName = urlParams.get('s');

      // 2. 元の正しいGASのウェブアプリURL（完全に維持）
      const gasBaseUrl = "https://script.google.com/macros/s/AKfycbxiBzzxnXGRX1TmFM8hquEf1zJ5f5UELYav3wzKk3lILdAnJHz3KClsZLGLR0VhK_ymag/exec";

      // 3. 店舗パラメータがあればURLに結合、なければそのまま
      const iframeSrc = storeName ? `${gasBaseUrl}?s=${encodeURIComponent(storeName)}` : gasBaseUrl;

      // 4. iframeにURLをセットして表示
      document.getElementById('timecard-frame').src = iframeSrc;
    };

    // 💡 GAS（子画面）からのメッセージ通信を処理する仕組み（コメントアウトを解除・修正）
    window.addEventListener("message", function(event) {
      console.log("親画面がメッセージを受信しました:", event.data);

      if (!event.data) return;

      // 📍 GPSの取得要求（REQUEST_GPS）が届いた場合
      if (event.data.type === "REQUEST_GPS") {
        if (!navigator.geolocation) {
          event.source.postMessage({
            type: "GPS_RESPONSE",
            success: false,
            error: "Geolocation not supported"
          }, "*");
          return;
        }

        navigator.geolocation.getCurrentPosition(
          function(position) {
            console.log("親画面でのGPS取得に成功しました。GASへ送り返します。");
            event.source.postMessage({
              type: "GPS_RESPONSE",
              success: true,
              lat: position.coords.latitude,
              lng: position.coords.longitude
            }, "*");
          },
          function(error) {
            console.error("親画面でのGPS取得に失敗しました:", error.message);
            event.source.postMessage({
              type: "GPS_RESPONSE",
              success: false,
              error: error.message
            }, "*");
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      }

      // 🔄 GASから「画面を強制更新して！」というリクエスト（FORCE_RELOAD）が届いた場合
      if (event.data.type === "FORCE_RELOAD") {
        console.log("アプリの強制再読み込みを実行します。");
        
        // 現在のURL（店舗パラメータなどを含む）を取得し、末尾に最新時刻の数字（タイムスタンプ）を強制付与
        const currentUrl = new URL(window.location.href);
        currentUrl.searchParams.set('reload_ts', Date.now().toString());
        
        // iPadに別のページだと認識させて、キャッシュを無視して完全にリロード
        window.location.href = currentUrl.toString();
      }
    });
  </script>
</body>
</html>
